<div class="task-context">
  <aside class="task-sidebar" aria-label="Task navigation">
    <div class="task-heading">
      <div class="task-identifiers">
        <span class="task-number">Task {{ taskId() }}</span>
        <span class="policy-number">Policy {{ policy().policyNumber }}</span>
      </div>
    </div>
    <button pButton type="button" class="contacts-button" (click)="openContacts()"><svg lucidePhone aria-hidden="true" /><span>Contacts</span></button>
    <button pButton type="button" class="worksheet-button"><svg lucidePrinter aria-hidden="true" /><span>Visit Worksheet</span></button>
    <div class="forms-navigation">
      <h2>Forms</h2>
      <ul>
        @for (form of forms(); track form.slug) {
          <li [class.complete]="form.completed">
            <a [routerLink]="['/tasks', taskId(), 'forms', form.slug]" routerLinkActive="active" ariaCurrentWhenActive="page">
              @if (form.completed) { <svg lucideCheckCircle2 aria-hidden="true" /> } @else { <svg lucideCircle aria-hidden="true" /> }
              <span>{{ form.label }}</span>
              @if (form.completed) { <span class="sr-only">Completed</span> }
            </a>
          </li>
        }
      </ul>
    </div>
  </aside>

  <div class="task-workspace">
    <app-top-navigation [policyId]="policy().id" [taskId]="taskId()" [taskDetail]="true" [highSeverityRecommendationCount]="highSeverityRecommendationCount()" (takePhoto)="openPhotoDialog()" (openAttachments)="openDocumentDialog()" />
    <router-outlet />
  </div>
</div>
<app-photo-upload-dialog [open]="photoDialogOpen()" (closed)="closePhotoDialog()" />
<app-document-upload-dialog [open]="documentDialogOpen()" (closed)="closeDocumentDialog()" />
