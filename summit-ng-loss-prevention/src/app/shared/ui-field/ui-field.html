<label [for]="id()">{{ label() }} @if (required()) { <span aria-hidden="true">*</span><span class="sr-only">required</span> }</label>
<div class="control" [class.has-icon]="kind() !== 'text'">
  @if (kind() === 'select') {
    <select [id]="id()" [attr.aria-required]="required()" [value]="value()">
      @for (option of options().length ? options() : [value()]; track option) { <option [value]="option">{{ option }}</option> }
    </select>
    <svg lucideChevronDown aria-hidden="true" />
  } @else {
    <input [id]="id()" [value]="value()" [attr.aria-required]="required()" [attr.inputmode]="kind() === 'date' ? 'numeric' : null" />
    @if (kind() === 'date') { <svg lucideCalendarDays aria-hidden="true" /> }
  }
</div>
