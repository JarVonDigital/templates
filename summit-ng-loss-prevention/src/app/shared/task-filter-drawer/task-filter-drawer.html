<app-filter-drawer title="Filter tasks" (dismissed)="closed.emit()">
  <section class="saved-filters" aria-labelledby="saved-filters-title">
    <h3 id="saved-filters-title">Saved filters</h3>
    <p-select inputId="saved-filter" ariaLabel="Load a saved filter" [options]="savedFilterOptions()" optionLabel="label" optionValue="value" [ngModel]="selectedSavedFilter()" (ngModelChange)="loadSavedFilter($event)" [fluid]="true" />
    <div class="saved-filter-actions"><input pInputText type="text" placeholder="Name this filter" aria-label="Saved filter name" [ngModel]="savedFilterName()" (ngModelChange)="savedFilterName.set($event)" /><button pButton type="button" severity="secondary" [disabled]="!savedFilterName().trim()" (click)="save()">Save</button><button pButton type="button" severity="secondary" [disabled]="!selectedSavedFilter()" (click)="delete()" aria-label="Delete selected saved filter"><svg lucideTrash2 aria-hidden="true" /></button></div>
  </section>
  <section aria-labelledby="location-title"><h3 id="location-title">Location</h3><div class="filter-grid"><label>State<p-select inputId="state" ariaLabel="State" [options]="stateOptions()" optionLabel="label" optionValue="value" [ngModel]="working().state" (ngModelChange)="changeState($event)" [fluid]="true" /></label><label>County <span>(optional)</span><p-select inputId="county" ariaLabel="County" [options]="countyOptions()" optionLabel="label" optionValue="value" [disabled]="!working().state" [ngModel]="working().county" (ngModelChange)="update('county', $event)" [fluid]="true" /></label><label>City<p-select inputId="city" ariaLabel="City" [options]="cityOptions()" optionLabel="label" optionValue="value" [disabled]="!working().state" [ngModel]="working().city" (ngModelChange)="update('city', $event)" [fluid]="true" /></label><label>Zip <span>(exact match)</span><input pInputText type="text" inputmode="numeric" maxlength="5" placeholder="e.g. 33801" [ngModel]="working().zip" (ngModelChange)="update('zip', $event)" /></label></div><p class="hint">County and city require a state. Zip can be entered independently.</p></section>
  <section aria-labelledby="due-date-title"><h3 id="due-date-title">Due date</h3><p-buttonGroup aria-label="Due date comparison"><button pButton type="button" [severity]="working().dueMode === 'before' ? 'primary' : 'secondary'" (click)="selectDueMode('before')">Before</button><button pButton type="button" [severity]="working().dueMode === 'on' ? 'primary' : 'secondary'" (click)="selectDueMode('on')">On</button><button pButton type="button" [severity]="working().dueMode === 'after' ? 'primary' : 'secondary'" (click)="selectDueMode('after')">After</button><button pButton type="button" [severity]="working().dueMode === 'range' ? 'primary' : 'secondary'" (click)="selectDueMode('range')">Range</button></p-buttonGroup><div class="filter-grid" [class.single-column]="working().dueMode !== 'range'"><label>{{ working().dueMode === 'range' ? 'From' : 'Due date' }}<input pInputText type="date" [ngModel]="working().due" (ngModelChange)="update('due', $event)" /></label>@if (working().dueMode === 'range') { <label>Through<input pInputText type="date" [min]="working().due" [ngModel]="working().dueEnd" (ngModelChange)="update('dueEnd', $event)" /></label> }</div></section>
  <section aria-labelledby="premium-title"><h3 id="premium-title">Premium range</h3><div class="filter-grid"><label>Minimum ($)<input pInputText type="number" min="0" placeholder="No minimum" [ngModel]="working().premiumMin" (ngModelChange)="update('premiumMin', $event)" /></label><label>Maximum ($)<input pInputText type="number" min="0" placeholder="No maximum" [ngModel]="working().premiumMax" (ngModelChange)="update('premiumMax', $event)" /></label></div></section>
  <section aria-labelledby="task-information-title"><h3 id="task-information-title">Task information</h3><div class="filter-stack"><label>Status<p-select inputId="status" ariaLabel="Status" [options]="statusOptions()" optionLabel="label" optionValue="value" [ngModel]="working().status" (ngModelChange)="update('status', $event)" [fluid]="true" /></label><label>Task ID<input pInputText type="text" inputmode="numeric" placeholder="Any task ID" [ngModel]="working().taskId" (ngModelChange)="update('taskId', $event)" /></label><label>Policy #<input pInputText type="text" placeholder="Any policy" [ngModel]="working().policy" (ngModelChange)="update('policy', $event)" /></label><label>Client name<input pInputText type="text" placeholder="Any client" [ngModel]="working().client" (ngModelChange)="update('client', $event)" /></label><label>Last visit<input pInputText type="date" [ngModel]="working().lastVisit" (ngModelChange)="update('lastVisit', $event)" /></label><label>Cancelled<p-select inputId="cancelled" ariaLabel="Cancelled" [options]="[{ label: 'Any', value: '' }, { label: 'Cancelled', value: 'yes' }, { label: 'Not cancelled', value: 'no' }]" optionLabel="label" optionValue="value" [ngModel]="working().cancelled" (ngModelChange)="update('cancelled', $event)" [fluid]="true" /></label><label>Reason<p-select inputId="reason" ariaLabel="Reason" [options]="reasonOptions()" optionLabel="label" optionValue="value" [ngModel]="working().reason" (ngModelChange)="update('reason', $event)" [fluid]="true" /></label><label>Consultant<p-select inputId="consultant" ariaLabel="Consultant" [options]="consultantOptions()" optionLabel="label" optionValue="value" [ngModel]="working().consultant" (ngModelChange)="update('consultant', $event)" [fluid]="true" /></label></div></section>
  <ng-template #footer><div class="drawer-actions"><button pButton type="button" severity="secondary" (click)="resetDraft()">Reset</button><button pButton type="button" (click)="apply()">Show results</button></div></ng-template>
</app-filter-drawer>
